# Backend only for now; the frontend service is added with the Next.js app.
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - path: .env
        required: false
    ports:
      - "8000:8000"
    volumes:
      - rb_data:/data/rb_data      # Rebrickable CSVs + index cache survive rebuilds

volumes:
  rb_data:
